name: Release

on:
  push:
    branches: [main]

# Only run one release at a time. A second push while the first is mid-publish
# would otherwise race with changesets' version bump commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version + publish via changesets
    runs-on: ubuntu-latest
    # Push events from forks don't carry the secrets needed to publish; skip
    # them to avoid a noisy red status on community PRs.
    if: github.repository_owner == 'usewhisk'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # Version is read from the root `package.json`'s `packageManager`
      # field. Passing `with: version` alongside `packageManager` is a
      # hard error in `pnpm/action-setup@v6` (ERR_PNPM_BAD_PM_VERSION).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # No dependency cache in the job that publishes, so a poisoned cache
          # cannot reach the registry.
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships with npm 10.x, which can generate provenance attestations
      # but does NOT know how to perform the OIDC auth handshake with the npm
      # registry. Trusted Publishing requires npm >= 11.5.1; without it the
      # PUT to the registry goes out unauthenticated and we get a 404.
      - name: Upgrade npm for Trusted Publishing OIDC
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Either opens / updates a "Version Packages" PR, or — when that PR
      # has been merged — runs `pnpm release` which publishes new versions
      # to npm with provenance.
      #
      # `pnpm run version` (not bare `pnpm version`) is required because pnpm
      # has a built-in `version` subcommand that just prints diagnostics; the
      # `run` prefix forces it to invoke our npm script (`changeset version`).
      - name: Create release PR or publish
        # v2 needs Changesets CLI v3 and renames these inputs. Stay on v1
        # until the repo moves to CLI v3.
        uses: changesets/action@v1.9.0
        with:
          version: pnpm run version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: this repo publishes via Trusted Publishing (OIDC),
          # which is granted through the `id-token: write` permission above.
          # An empty `NPM_TOKEN` would actively interfere with the OIDC handshake.
          NPM_CONFIG_PROVENANCE: "true"
