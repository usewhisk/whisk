name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  checks:
    name: format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm/action-setup reads the version from packageManager; passing one here is an error.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier (format check)
        run: pnpm format:check
      - name: Build packages
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test

  build:
    name: build, release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Build apps
        run: pnpm build:apps
      - name: Release Notes Governance Gate
        run: STRICT_RELEASE_NOTES=true bash scripts/check_release_notes.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Moderate and low advisories go through Dependabot instead of blocking PRs.
      - name: Audit (high and critical)
        run: pnpm audit --audit-level=high

  secrets:
    uses: usewhisk/.github/.github/workflows/secrets.yml@main

  commits:
    uses: usewhisk/.github/.github/workflows/commits.yml@main

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [checks, tests, build, audit, secrets, commits]
    if: always()
    steps:
      - name: Every gate passed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          echo ok
